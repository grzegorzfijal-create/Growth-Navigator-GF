/* ============================================================== zdarzenia */

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const session = currentSession();
  const entryIndex = el.dataset.entry !== undefined ? Number(el.dataset.entry) : null;
  const setIndex = el.dataset.set !== undefined ? Number(el.dataset.set) : null;

  const actions = {
    tab: () => go(el.dataset.id),
    back: () => { State.screen = null; render(); },
    "sheet-bg": () => { if (event.target === el) closeSheet(); },
    "close-sheet": closeSheet,
    settings: () => { State.screen = "settings"; render(); },

    start: () => startSession(el.dataset.day),
    "start-empty": () => startSession(null),
    "open-runner": () => { State.sessionId = el.dataset.id; State.screen = "runner"; render(); },
    "open-session": () => { State.sessionId = el.dataset.id; State.screen = "session"; render(); },
    "open-exercise": () => { State.exerciseId = el.dataset.id; State.screen = "exercise"; render(); },
    metric: () => { State.metric = el.dataset.metric; render(); },

    "toggle-set": () => {
      const entry = session.entries[entryIndex];
      const set = entry.sets[setIndex];
      if (set.done) { set.done = false; }
      else {
        const ex = EX_BY_ID[entry.exId] || { step: 2.5 };
        const previous = Store.lastPerformance(entry.exId, session.id);
        const hint = suggest(previous ? previous.sets : [], entry.target || {}, ex.step || 2.5);
        if (set.weight === null || set.weight === undefined || set.weight === "") set.weight = hint.weight || 0;
        if (!set.reps) set.reps = hint.reps || (entry.target && entry.target.repsMin) || 8;
        set.done = true;
        if (!set.warmup) startRest((entry.target && entry.target.rest) || 120);
        const next = entry.sets.findIndex((s, i) => i !== setIndex && !s.done);
        if (next >= 0) State.focusSetId = entryIndex + "-" + next;
      }
      saveSession(session);
      State.keepScroll = true;
      render();
    },

    effort: () => effortSheet(entryIndex, setIndex),
    "pick-effort": () => {
      const raw = el.dataset.value;
      const set = session.entries[entryIndex].sets[setIndex];
      if (raw === "") { set.rpe = null; set.rir = null; }
      else if (Store.state.profile.scale === "rir") { set.rir = Number(raw); set.rpe = round(10 - Number(raw), 1); }
      else { set.rpe = Number(raw); set.rir = round(10 - Number(raw), 1); }
      saveSession(session);
      closeSheet();
      State.keepScroll = true;
      render();
    },

    "set-options": () => setOptionsSheet(entryIndex, setIndex),
    "toggle-warmup": () => {
      const set = session.entries[entryIndex].sets[setIndex];
      set.warmup = !set.warmup;
      saveSession(session); closeSheet(); State.keepScroll = true; render();
    },
    "drop-set": () => {
      session.entries[entryIndex].sets.splice(setIndex, 1);
      saveSession(session); closeSheet(); State.keepScroll = true; render();
    },
    "add-set": () => {
      const sets = session.entries[entryIndex].sets;
      const last = sets[sets.length - 1] || {};
      sets.push({ weight: last.weight ?? null, reps: last.reps ?? null, rpe: null, rir: null, done: false, warmup: false, note: "" });
      saveSession(session); State.keepScroll = true; render();
    },
    "apply-hint": () => {
      const weight = Number(el.dataset.weight);
      session.entries[entryIndex].sets.forEach((set) => { if (!set.done) set.weight = weight; });
      saveSession(session); State.keepScroll = true; render();
      toast("Wpisano " + weight + " kg w niezrobione serie.");
    },
    "drop-exercise": () => {
      session.entries.splice(entryIndex, 1);
      saveSession(session); State.keepScroll = true; render();
    },
    note: () => {
      const entry = session.entries[entryIndex];
      openSheet("Notatka do ćwiczenia",
        '<textarea class="input" id="entryNote" placeholder="np. dobra technika, ostatnie powtórzenie ciężkie">' + escapeHtml(entry.note || "") + "</textarea>" +
        '<button class="btn block" style="margin-top:10px" data-act="save-note" data-entry="' + entryIndex + '">Zapisz</button>');
    },
    "save-note": () => {
      session.entries[entryIndex].note = document.getElementById("entryNote").value.trim();
      saveSession(session); closeSheet(); State.keepScroll = true; render();
    },
    "add-exercise": () => exercisePickerSheet("pick-exercise"),
    "pick-exercise": () => {
      const ex = EX_BY_ID[el.dataset.id];
      const previous = Store.lastPerformance(ex.id, session.id);
      const hint = suggest(previous ? previous.sets : [], {}, ex.step || 2.5);
      session.entries.push({
        exId: ex.id, superset: null, note: "",
        target: { sets: 3, repsMin: 8, repsMax: 12, rpe: 8, rest: 120 },
        sets: Array.from({ length: 3 }, () => ({ weight: hint.weight, reps: hint.reps || 8, rpe: null, rir: null, done: false, warmup: false, note: "" })),
      });
      saveSession(session); closeSheet(); render();
    },

    finish: () => {
      const t = totals((session.entries || []).flatMap((e) => e.sets || []));
      const elapsed = Math.round((Date.now() - new Date(session.startedAt)) / 60000);
      openSheet("Zakończyć trening?",
        '<div class="tile-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">' +
        tile("Czas", minutesLabel(elapsed)) + tile("Serie", t.sets) + tile("Objętość", volumeLabel(t.volume)) + "</div>" +
        '<textarea class="input" id="sessionNote" placeholder="Notatka do treningu">' + escapeHtml(session.note || "") + "</textarea>" +
        '<button class="btn block lg" style="margin-top:12px" data-act="confirm-finish">Zapisz trening</button>' +
        '<button class="btn danger block" style="margin-top:8px" data-act="discard">Odrzuć trening</button>',
        "Niezaznaczone serie nie trafią do historii.");
    },
    "confirm-finish": () => {
      const note = document.getElementById("sessionNote");
      if (note) session.note = note.value.trim();
      finishSession();
    },
    discard: () => {
      if (!window.confirm("Usunąć ten trening razem z wpisanymi seriami?")) return;
      Store.sessions = Store.sessions.filter((s) => s.id !== session.id);
      Store.push("session", session.id);
      stopRest(); closeSheet();
      State.screen = null; State.tab = "trening"; render();
    },
    "delete-session": () => {
      if (!window.confirm("Usunąć ten trening z historii?")) return;
      Store.sessions = Store.sessions.filter((s) => s.id !== el.dataset.id);
      Store.push("session", el.dataset.id);
      State.screen = null; State.tab = "historia"; render();
    },

    rest: () => startRest(Number(el.dataset.sec)),
    "rest-add": () => { Rest.endsAt += 30000; Rest.duration += 30; tickRest(); },
    "rest-stop": stopRest,

    date: () => { State.date = addDays(State.date, Number(el.dataset.delta)); render(); },
    "add-meal": () => {
      openSheet("Nowy posiłek",
        '<div class="field"><label for="mealName">Nazwa</label><select class="input" id="mealName">' +
        MEAL_NAMES.map((n) => "<option>" + n + "</option>").join("") + "</select></div>" +
        '<div class="field" style="margin-top:10px"><label for="mealTime">Godzina</label><input class="input" id="mealTime" type="time" value="' +
        new Date().toTimeString().slice(0, 5) + '"></div>' +
        '<button class="btn block" style="margin-top:12px" data-act="save-meal">Dodaj posiłek</button>');
    },
    "save-meal": () => {
      const day = Store.day(State.date);
      day.meals.push({ id: uid("meal"), name: document.getElementById("mealName").value, time: document.getElementById("mealTime").value, items: [] });
      Store.push("day", State.date); closeSheet(); render();
    },
    "drop-meal": () => {
      Store.day(State.date).meals.splice(Number(el.dataset.meal), 1);
      Store.push("day", State.date); render();
    },
    "add-item": () => foodSheet(Number(el.dataset.meal)),
    "pick-food": () => {
      const food = FOODS.find((f) => f.id === el.dataset.id);
      const qty = Number(window.prompt(food.per === "szt" ? "Ile sztuk?" : "Ile gramów?", food.per === "szt" ? "1" : "100"));
      if (!Number.isFinite(qty) || qty <= 0) return;
      const macros = portion(food, qty);
      Store.day(State.date).meals[Number(el.dataset.meal)].items.push(
        Object.assign({ id: uid("item"), name: food.name, qty, unit: food.per === "szt" ? "szt" : "g" }, macros));
      Store.push("day", State.date); closeSheet(); render();
    },
    "add-manual": () => {
      const name = document.getElementById("mName").value.trim();
      if (!name) { toast("Podaj nazwę produktu."); return; }
      const num = (id) => Math.max(0, Number(document.getElementById(id).value) || 0);
      Store.day(State.date).meals[Number(el.dataset.meal)].items.push({
        id: uid("item"), name, qty: null, unit: "g",
        kcal: num("mKcal"), protein: num("mP"), carbs: num("mC"), fat: num("mF"),
      });
      Store.push("day", State.date); closeSheet(); render();
    },
    "drop-item": () => {
      Store.day(State.date).meals[Number(el.dataset.meal)].items.splice(Number(el.dataset.item), 1);
      Store.push("day", State.date); render();
    },
    weight: () => {
      const value = Number(window.prompt("Masa ciała (kg)", Store.day(State.date).weight || Store.state.profile.weight || ""));
      if (!Number.isFinite(value) || value < 20 || value > 400) return;
      Store.day(State.date).weight = round(value, 1);
      Store.state.profile.weight = round(value, 1);
      Store.push("day", State.date); Store.push("state"); render();
    },
    goals: () => {
      const target = Store.state.goals || macroTargets(Store.state.profile) || { kcal: 2500, protein: 160, carbs: 280, fat: 80 };
      openSheet("Cele dzienne",
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
        '<div class="field"><label for="gKcal">Kalorie</label><input class="input" id="gKcal" type="number" value="' + target.kcal + '"></div>' +
        '<div class="field"><label for="gP">Białko (g)</label><input class="input" id="gP" type="number" value="' + target.protein + '"></div>' +
        '<div class="field"><label for="gC">Węglowodany (g)</label><input class="input" id="gC" type="number" value="' + target.carbs + '"></div>' +
        '<div class="field"><label for="gF">Tłuszcze (g)</label><input class="input" id="gF" type="number" value="' + target.fat + '"></div></div>' +
        '<button class="btn block" style="margin-top:12px" data-act="save-goals">Zapisz cele</button>' +
        '<button class="btn ghost block" style="margin-top:8px" data-act="auto-goals">Policz z profilu</button>',
        "Możesz je nadpisać w każdej chwili.");
    },
    "save-goals": () => {
      const num = (id) => Math.max(0, Number(document.getElementById(id).value) || 0);
      Store.state.goals = { kcal: num("gKcal"), protein: num("gP"), carbs: num("gC"), fat: num("gF") };
      Store.push("state"); closeSheet(); render(); toast("Cele zapisane.");
    },
    "auto-goals": () => { Store.state.goals = null; Store.push("state"); closeSheet(); render(); },

    supp: () => {
      const day = Store.day(el.dataset.date);
      const list = day.supps[el.dataset.id] || [];
      const timing = el.dataset.timing;
      day.supps[el.dataset.id] = list.includes(timing) ? list.filter((t) => t !== timing) : list.concat(timing);
      Store.push("day", el.dataset.date);
      State.keepScroll = true;
      render();
    },
    "add-supp": () => {
      openSheet("Nowy suplement",
        '<div class="field"><label for="sName">Nazwa</label><input class="input" id="sName" placeholder="np. Cynk"></div>' +
        '<div class="field" style="margin-top:10px"><label for="sDose">Dawka</label><input class="input" id="sDose" placeholder="np. 15 mg"></div>' +
        '<div class="field" style="margin-top:10px"><label for="sTiming">Pora</label><select class="input" id="sTiming">' +
        Object.keys(TIMINGS).map((k) => '<option value="' + k + '">' + TIMINGS[k] + "</option>").join("") + "</select></div>" +
        '<button class="btn block" style="margin-top:12px" data-act="save-supp">Dodaj</button>');
    },
    "save-supp": () => {
      const name = document.getElementById("sName").value.trim();
      if (!name) { toast("Podaj nazwę suplementu."); return; }
      Store.state.supps.push({
        id: uid("supp"), name, dose: document.getElementById("sDose").value.trim(),
        timing: [document.getElementById("sTiming").value], days: [1, 2, 3, 4, 5, 6, 7], note: "",
      });
      Store.push("state"); closeSheet(); render();
    },
    "drop-supp": () => {
      Store.state.supps.splice(Number(el.dataset.index), 1);
      Store.push("state"); render();
    },

    "edit-day": () => {
      const day = planDay(el.dataset.day);
      openSheet(day.name,
        '<div class="list">' + day.exercises.map((item, index) => {
          const ex = EX_BY_ID[item.exId] || { name: "?" };
          return '<div class="item" style="cursor:default"><span class="grow"><span style="display:block;font-weight:600">' + escapeHtml(ex.name) + "</span>" +
            '<span class="tiny muted num">' + item.sets + " x " + item.repsMin + "-" + item.repsMax + " - RPE " + item.rpe + " - przerwa " + item.rest + " s</span></span>" +
            '<button class="icon-btn" data-act="plan-drop" data-day="' + day.id + '" data-index="' + index + '" aria-label="Usuń">✕</button></div>';
        }).join("") + "</div>" +
        '<button class="btn ghost block" style="margin-top:10px" data-act="plan-add" data-day="' + day.id + '">+ Dodaj ćwiczenie</button>',
        "Zmiany dotyczą planu, nie zapisanej historii.");
    },
    "plan-drop": () => {
      planDay(el.dataset.day).exercises.splice(Number(el.dataset.index), 1);
      Store.push("state"); closeSheet(); render();
    },
    "plan-add": () => { State.planDayId = el.dataset.day; exercisePickerSheet("plan-pick"); },
    "plan-pick": () => {
      planDay(State.planDayId).exercises.push(X(el.dataset.id, 3, 8, 12, 8, 120));
      Store.push("state"); closeSheet(); render(); toast("Dodano do planu.");
    },

    "seed-demo": () => { seedDemo(); toast("Wgrano dane przykładowe."); },
    "clear-demo": () => {
      Store.sessions = Store.sessions.filter((s) => !s.demo);
      Object.keys(Store.days).forEach((date) => { if (Store.days[date] && Store.days[date].demo) delete Store.days[date]; });
      Store.state.demo = false;
      Store.push("state");
      Store.sessions.forEach((s) => Store.push("session", s.id));
      if (Store.db) Store.db.collection("sessions").get().then((snap) => {
        snap.docs.forEach((doc) => { if (!Store.session(doc.id)) Store.db.doc("sessions/" + doc.id).delete(); });
      }).catch(() => {});
      render();
      toast("Dane przykładowe usunięte.");
    },
    reset: () => {
      if (!window.confirm("Usunąć wszystkie dane tej aplikacji?")) return;
      Store.state = Store.blank();
      Store.sessions = []; Store.days = {};
      Store.push("state");
      if (Store.db) {
        Store.db.collection("sessions").get().then((snap) => snap.docs.forEach((d) => Store.db.doc("sessions/" + d.id).delete())).catch(() => {});
        Store.db.collection("days").get().then((snap) => snap.docs.forEach((d) => Store.db.doc("days/" + d.id).delete())).catch(() => {});
      }
      try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
      State.screen = null; State.tab = "dzis"; render();
    },
  };

  if (actions[act]) { event.preventDefault(); actions[act](); }
});

/* Wpisywanie ciężaru i powtórzeń nie przerysowuje ekranu - kursor zostaje na miejscu. */
document.addEventListener("input", (event) => {
  const el = event.target;
  if (el.dataset.input) {
    const session = currentSession();
    if (!session) return;
    const set = session.entries[Number(el.dataset.entry)].sets[Number(el.dataset.set)];
    const value = el.value === "" ? null : Number(el.value);
    set[el.dataset.input] = value;
    saveSession(session);
    return;
  }
  if (el.dataset.act === "filter-ex" || el.dataset.act === "filter-food") {
    const needle = el.value.trim().toLowerCase();
    const list = document.getElementById(el.dataset.act === "filter-ex" ? "exList" : "foodList");
    list.querySelectorAll("[data-name]").forEach((item) => {
      item.classList.toggle("hidden", needle && !item.dataset.name.includes(needle));
    });
    list.querySelectorAll("[data-group]").forEach((group) => {
      group.classList.toggle("hidden", !group.querySelector("[data-name]:not(.hidden)"));
    });
  }
});

document.addEventListener("change", (event) => {
  const el = event.target;
  if (!el.dataset.profile) return;
  const key = el.dataset.profile;
  const numeric = ["age", "height", "weight", "step"];
  Store.state.profile[key] = numeric.includes(key) ? Number(el.value) : el.value;
  Store.push("state");
  if (key === "scale") render();
});

document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("gym93.theme", dark ? "light" : "dark"); } catch (e) {}
});

/* ========================================================== dane przykładowe */

function makeRandom(seed) {
  let state = seed;
  return () => { state = (state * 1664525 + 1013904223) % 4294967296; return state / 4294967296; };
}

/** Sześć tygodni realistycznej historii - żeby wykresy i rekordy miały co pokazać. */
function seedDemo() {
  const random = makeRandom(93);
  const startWeights = {
    bench: 72.5, inc_db: 24, db_ohp: 20, lateral: 10, pushdown: 25,
    deadlift: 120, pullup: 0, row_bb: 60, pulldown: 55, facepull: 20, curl_bb: 30,
    squat: 95, rdl: 80, legpress: 150, legcurl: 40, calf: 60,
  };
  const weeklyStep = { bench: 1.25, deadlift: 2.5, squat: 2.5, legpress: 5, pullup: 1.25 };
  const monday = startOfWeek(today());

  for (let week = 6; week >= 0; week -= 1) {
    Store.state.plan.days.forEach((day, index) => {
      const date = addDays(monday, -(week * 7) + index * 2);
      if (date >= today()) return;
      const started = new Date(date + "T17:30:00");
      const entries = day.exercises.map((item) => {
        const ex = EX_BY_ID[item.exId] || { step: 2.5 };
        const base = (startWeights[item.exId] || 40) + (weeklyStep[item.exId] || 1) * (6 - week);
        const weight = toPlate(base, ex.step || 2.5);
        return {
          exId: item.exId, superset: item.superset || null, note: "",
          target: { sets: item.sets, repsMin: item.repsMin, repsMax: item.repsMax, rpe: item.rpe, rest: item.rest },
          sets: Array.from({ length: item.sets }, (_, i) => {
            const fatigue = i * 0.4;
            const reps = Math.max(item.repsMin - 1, Math.round(item.repsMax - fatigue - random()));
            const rpe = Math.min(10, Math.round((item.rpe + fatigue * 0.5) * 2) / 2);
            return { weight, reps, rpe, rir: round(10 - rpe, 1), done: true, warmup: false, note: "" };
          }),
        };
      });
      const session = {
        id: uid("demo"), demo: true, date, dayId: day.id, name: day.name,
        startedAt: started.toISOString(),
        finishedAt: new Date(started.getTime() + (58 + Math.round(random() * 18)) * 60000).toISOString(),
        note: "", entries,
      };
      const t = totals(entries.flatMap((e) => e.sets));
      Object.assign(session, { volume: t.volume, sets: t.sets, reps: t.reps, avgRpe: t.avgRpe });
      Store.sessions.push(session);
      Store.push("session", session.id);
    });
  }
  Store.sessions.sort((a, b) => (a.date < b.date ? 1 : -1));

  /* Kilka dni jedzenia, suplementów i pomiarów masy ciała. */
  const template = [
    ["Śniadanie", "08:30", [["owsianka", 80], ["jajko", 3], ["banan", 1]]],
    ["Obiad", "13:30", [["kurczak", 200], ["ryz", 300], ["brokul", 150]]],
    ["Kolacja", "20:30", [["twarog", 200], ["chleb", 80], ["awokado", 60]]],
  ];
  for (let back = 6; back >= 0; back -= 1) {
    const date = addDays(today(), -back);
    const day = Store.day(date);
    day.demo = true;
    // Dzisiaj dzień jeszcze trwa - kolacji nikt nie zjadł o poranku.
    const meals = back === 0 ? template.slice(0, 2) : template;
    day.meals = meals.map(([name, time, items]) => ({
      id: uid("meal"), name, time,
      items: items.map(([foodId, qty]) => {
        const food = FOODS.find((f) => f.id === foodId);
        return Object.assign({ id: uid("item"), name: food.name, qty, unit: food.per === "szt" ? "szt" : "g" }, portion(food, qty));
      }),
    }));
    day.weight = round(83.4 + (6 - back) * 0.05 + (random() - 0.5) * 0.6, 1);
    (Store.state.supps || []).forEach((supp) => {
      if (!supp.days.includes(weekday(date)) || random() > 0.85) return;
      // Dzisiejsze dawki zostawiamy do odhaczenia w aplikacji.
      if (back > 0) day.supps[supp.id] = supp.timing.slice();
    });
    Store.push("day", date);
  }

  Store.state.demo = true;
  Store.push("state");
  render();
}

/* ================================================================= start */

async function boot() {
  try {
    const theme = localStorage.getItem("gym93.theme");
    if (theme) document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}

  const hadLocal = Store.loadLocal();
  if (!hadLocal) Store.state = Store.blank();
  Store.ready = true;
  render();

  let db = null;
  try { db = await Store.connect(); } catch (e) { db = null; }

  if (db) {
    try {
      if (await Store.loadRemote()) {
        setSync("saved");
        Store.saveLocal();
        render();
        return;
      }
    } catch (error) {
      setSync("local");
      return;
    }
  }

  // Pierwsze wejście: nie zostawiamy pustej skorupy, tylko przykładowy tydzień treningów.
  if (!hadLocal && Store.sessions.length === 0) seedDemo();

  if (db) {
    Store.push("state");
    Store.sessions.forEach((session) => Store.push("session", session.id));
    Object.keys(Store.days).forEach((date) => Store.push("day", date));
  } else {
    setSync("local");
    Store.saveLocal();
  }
  render();
}

boot();
</script>
